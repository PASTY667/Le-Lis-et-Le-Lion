 # ═══════════════════════════════════════════════════════════════════
 # 1307 — The Fall of the Temple
 # ═══════════════════════════════════════════════════════════════════
 bm_chute_du_temple_1307: "The Fall of the Temple"
 bm_chute_du_temple_1307_desc: "On Friday, October 13th, 1307, Philip IV of France orders the simultaneous arrest of all Templars in the realm. The Order of the Temple — guardian of faith and the finances of Christendom — collapses under accusations of heresy. Grand Master Jacques de Molay will burn at the stake in 1314, cursing king and pope alike. Europe stands on the edge of a new and turbulent age."

 bm_char_philippe_iv: "Philip IV"
 bm_char_philippe_iv_desc: "King of France since 1285, Philip the Fair is the most powerful ruler in Christendom. His struggle with the papacy, crowned by the transfer of the Holy See to Avignon, reshapes the balance between temporal and spiritual power. By ordering the arrest of the Templars on this ill-fated Friday the 13th, he reaches the height of his power — and perhaps the beginning of a curse promised by Jacques de Molay from his pyre.\n\nWill you bring the papacy to heel and break the Order of the Temple without drawing down the vengeance of heaven upon your line?"

 bm_char_edward_ii: "Edward II"
 bm_char_edward_ii_desc: "King of England since the death of his father Edward I in July 1307, Edward II inherits a realm at the height of its military expansion — but also a Scottish throne still contested by Robert Bruce, and an English nobility humiliated by the king's favourites. His reign promises to be a difficult one.\n\nWill you tame your barons and complete the conquest of Scotland where your father failed?"

 bm_char_cangrande: "Cangrande"
 bm_char_cangrande_desc: "Co-lord of Verona with his brother Alboino since 1308, Cangrande della Scala is already a feared war leader, commanding seasoned mercenary companies. His ambition is clear: make Verona the mistress of Northern Italy, crushing Padua, Treviso, and anyone who stands in his way.\n\nWill you build one of the great powers of the Italian peninsula from a single lordship?"

 bm_char_siegfried: "Siegfried"
 bm_char_siegfried_desc: "Grand Master of the Teutonic Order since 1303, Siegfried von Feuchtwangen has moved the Order's seat to Marienburg in Prussia, at the heart of his Baltic conquests. His mission: expand the monastic state along the coast and complete — willing or not — the conversion of the last Baltic peoples still faithful to their old gods.\n\nWill you make the Teutonic Order the foremost power of the Baltic, whatever the cost in pagan and knightly blood alike?"

 bm_char_andronikos_ii: "Andronikos II"
 bm_char_andronikos_ii_desc: "Byzantine Emperor since 1282, Andronikos II Palaiologos rules over a diminished empire, gnawed at by usurpations from within his own family, an uncontrollable Catalan Company, and growing Turkish pressure in Anatolia. Will his piety and learning be enough to preserve what remains of Roman greatness?\n\nCan you set Byzantium back on its feet before its last bastion collapses?"

 bm_char_osman: "Osman I"
 bm_char_osman_desc: "Leader of a small Turkmen principality on the Byzantine frontier of Anatolia, Osman has just seized Ephesus and unknowingly lays the foundations of what will become the Ottoman Empire. With a weakened, divided Byzantine Empire nearby, the moment is ripe for an ambitious emirate.\n\nWill you turn a mere frontier beylik into the seed of an empire destined to span three continents?"

 bm_char_fernando_iv: "Fernando IV"
 bm_char_fernando_iv_desc: "King of Castile since 1295, Fernando IV, called 'the Summoned', survived a turbulent minority dominated by regencies and noble revolts. His dark legend — two wrongly executed brothers said to have summoned him from their pyre to join them before God within thirty days — looms over a reign marked by the renewed Reconquista against Granada.\n\nWill you outwit the curse said to hang over you, or will your reign end exactly as the prophecy foretells?"

 # ═══════════════════════════════════════════════════════════════════
 # 1348 — The Black Death
 # ═══════════════════════════════════════════════════════════════════
 bm_mort_noire_1348: "The Black Death"
 bm_mort_noire_1348_desc: "Coming from the steppes of Central Asia, the great bubonic plague reaches Europe in 1347. By spring 1348, it devastates France and England. Between a third and half of the European population will die. Wars cease, roads empty, cemeteries overflow. The world before will never return."

 bm_char_philippe_vi_1348: "Philip VI"
 bm_char_philippe_vi_1348_desc: "The King of France signed the truce with England after the disasters of Crécy (1346) and Calais (1347). His military glory is tarnished, his treasury drained. For many of his subjects, the plague ravaging the kingdom is nothing less than divine punishment upon a defeated king.\n\nWill you raise France from its ashes, or will your reign only hasten its decline?"

 bm_char_edward_iii_1348: "Edward III"
 bm_char_edward_iii_1348_desc: "Victor at Crécy, master of Calais, Edward III stands at the height of his military glory. But the plague strikes England as hard as France, sparing no rank: his own daughter Joan will die of the disease before even reaching Castile, where she was to be married.\n\nWill you turn your military triumphs into a lasting crown, despite the scourge striking your realm as hard as your enemies'?"

 bm_char_stefan_dusan: "Stefan Dušan"
 bm_char_stefan_dusan_desc: "King of Serbia, Stefan Dušan is waging a lightning conquest at the expense of an exhausted Byzantine Empire. He dreams of a unified Serbo-Greek empire under his crown — and soon, of an imperial title to match his ambitions.\n\nWill you build the new empire of the Balkans upon the ruins of Byzantium?"

 bm_char_louis_hongrie: "Louis I"
 bm_char_louis_hongrie_desc: "Son of Charles I of Anjou, King of Hungary since 1342, Louis I inherits an already powerful and well-run realm. His ambition: turn it into one of Central Europe's great powers, even if it means intervening as far as Southern Italy to avenge his brother Andrew, murdered in Naples.\n\nWill you make Hungary the arbiter of Central Europe, or will your thirst for vengeance in Naples cost you your crown?"

 # ═══════════════════════════════════════════════════════════════════
 # 1356 — Golden Bull
 # ═══════════════════════════════════════════════════════════════════
 bm_bulla_aurea_1356: "Bulla Aurea"
 bm_bulla_aurea_1356_desc: "On September 19th, 1356, the Black Prince defeats the French army at Poitiers and captures King John II. France without its king plunges into crisis: the Dauphin Charles governs an exhausted, rebellious, ravaged country. In January of the same year, Charles IV promulgated the Golden Bull — the fundamental charter of the Holy Roman Empire. Two texts written in golden ink — one for a constitution, one for a ransom."

 bm_char_charles_iv_1356: "Charles IV"
 bm_char_charles_iv_1356_desc: "Having promulgated the Golden Bull in January 1356, Charles IV must now govern the Holy Roman Empire and secure the lasting dominance of the House of Luxembourg: lock down the electoral states of Bohemia and Brandenburg, and gather as many electoral votes as possible to make his own dynasty prosper against the Habsburgs and Wittelsbachs.\n\nWill the Golden Bull become the foundation of a stable Empire at last, or will the Electors one day turn against you?"

 bm_char_albert_ii: "Albert II"
 bm_char_albert_ii_desc: "Duke of Austria since 1330, Albert II of Habsburg, called 'the Wise' despite his infirmity, actively supported Charles IV of Luxembourg in his struggle against Emperor Louis IV of Bavaria, helping bring about his downfall in 1347. But imperial recognition has not followed: the Golden Bull of 1356, which has just fixed the list of the seven Electors for centuries to come, pointedly ignores the House of Habsburg. A bitter grudge simmers in Vienna.\n\nWill you make Charles IV pay for this affront, or will you forge new titles of your own to catch up with the Electors?"

 bm_char_dauphin_charles: "The Dauphin Charles"
 bm_char_dauphin_charles_desc: "Your father, John II the Good, languishes in English captivity, Paris seethes under Étienne Marcel, and the Jacquerie is stirring in the countryside. To rule without the title — governing so contested a regency may prove harder than ruling a kingdom at peace.\n\nWill you hold your realm with a firm hand until your captive father returns — or dies?"

 bm_char_prince_noir: "Edward the Black Prince"
 bm_char_prince_noir_desc: "Victor of Poitiers, the Black Prince holds the King of France captive in his hands. His challenge: complete the conquest of the realm and turn this dazzling triumph into a true Angevin empire, as enduring as that of his distant ancestors.\n\nWill you make France an English possession, or will your victory prove to have no future?"

 bm_char_magnus_iv: "Magnus IV"
 bm_char_magnus_iv_desc: "King of Sweden and Norway, Magnus IV must stand up to the Hanseatic League, which already controls Baltic trade, and to the Teutonic Order, which eyes the very same coveted shores.\n\nCan you forge your united Scandinavian realms into a maritime power able to rival the Hansa?"

 bm_char_casimir_iii_1356: "Casimir III the Great"
 bm_char_casimir_iii_1356_desc: "The only Polish king to earn the title of the Great, Casimir the Legislator has reformed the kingdom's laws, built dozens of castles, and doubled Polish territory. The kingdom has never been stronger — the question is whether it will survive the king's lack of a male heir.\n\nWill you secure the permanence of your work, or will Poland sink into a succession crisis upon your death?"

