l_english:
 bm_guerre_cent_ans_1337_desc: "King Edward III of England has just claimed the throne of France, contesting the legitimacy of the Valois. The war that ignites in this late autumn of 1337 will last over a century, ravaging France and redrawing the map of Europe. Which side will you take?"

 bookmark_group_guerre_cent_ans: "The Hundred Years' War"

 bm_char_edward_iii: "Edward III"
 bm_char_philippe_vi: "Philip VI"
 bm_char_alphonse_xi: "Alfonso XI"
 bm_char_robert_naples: "Robert I"
 bm_char_gediminas: "Gediminas"
 bm_char_orhan: "Orhan"
 bm_char_david_ii: "David II"

 bm_char_david_ii_desc: "King of Scotland since 1329, David II is still a child under the tutelage of regents. Heir to his father Robert Bruce's victory over England, he will one day have to assert his own authority against English claims and a Scottish nobility divided between loyalty and ambition.\n\nWhen your majority comes, will you preserve the independence your father won at such a cost?"

 bm_char_edward_iii_desc: "Edward III of England is a warrior king at the height of his power. Heir of the Plantagenets and grandson of Philip IV through his mother Isabella, he claims the French crown against the Valois. A brilliant strategist, he relies on his Welsh archers and Flemish alliances to carry the war onto the continent.\n\nWill you make your claim to the French crown a reality, or will England exhaust itself in an endless war?"
 bm_char_philippe_vi_desc: "Philip VI of Valois is the first king of the Capetian cadet branch. His legitimacy, contested by Edward III, rests on Salic law alone. Facing the English invasion, he must rally an unruly French nobility and find the resources needed to finance a war that promises to be long.\n\nWill you secure the legitimacy of your new dynasty and repel England's claim to your throne?"
 bm_char_alphonse_xi_desc: "Alfonso XI of Castile is one of the most powerful monarchs of the Iberian peninsula. While the Hundred Years' War sets the north of Europe ablaze, he tirelessly pursues the Reconquista against the last Muslim strongholds. His kingdom sits at the crossroads of Franco-English alliances, each seeking to win over his powerful fleet.\n\nWill you complete the Reconquista, or will Castile be dragged into the rivalry between Paris and London?"
 bm_char_robert_naples_desc: "Robert I of Anjou, called the Wise, has ruled the Kingdom of Naples since 1309. A patron of the arts and letters, natural ally of France, he embodies Angevin power in the Mediterranean just as war breaks out between Paris and London.\n\nWill you make Naples the intellectual and political heart of Christian Mediterranean?"
 bm_char_gediminas_desc: "Grand Duke of Lithuania, Gediminas rules the last great pagan state in Europe, caught between relentless Teutonic Order raids and repeated calls to convert. Will he defend the old gods to the end, or see baptism as a double-edged diplomatic weapon?\n\nWill you build a pagan Lithuania able to rival its Christian neighbours, or will you ultimately bow to the cross?"
 bm_char_orhan_desc: "Son of Osman, Orhan inherits a rapidly expanding emirate on the marches of Bithynia. Under his rule, the Ottomans gain their first foothold in Europe, crossing the Dardanelles. His task: turn a frontier principality into a truly European power.\n\nWill you be the one to plant the Ottomans permanently on European soil?"

