l_french:

 bm_guerre_cent_ans_1337_desc: "Le roi d'Angleterre Édouard III vient de revendiquer le trône de France, contestant la légitimité des Valois. La guerre qui s'allume en cette fin d'automne 1337 durera plus d'un siècle, ravageant la France et redessinant la carte de l'Europe. Quel camp prendrez-vous ?"

 bookmark_group_guerre_cent_ans: "La Guerre de Cent Ans"

 # Noms affichés des personnages du bookmark — CORRECTION : ces clés "name" manquaient
 # entièrement dans la version précédente, ce qui rendait les fiches personnages vides
 # ou cassées dans le sélecteur de bookmark.
 bm_char_edward_iii: "Édouard III"
 bm_char_philippe_vi: "Philippe VI"
 bm_char_alphonse_xi: "Alphonse XI"
 bm_char_robert_naples: "Robert Ier"
 bm_char_gediminas: "Gediminas"
 bm_char_orhan: "Orhan"
 bm_char_david_ii: "David II"

 bm_char_david_ii_desc: "Roi d'Écosse depuis 1329, David II n'est encore qu'un enfant sous la tutelle de régents. Héritier de la victoire de son père Robert Bruce sur l'Angleterre, il devra un jour affirmer seul son autorité face aux prétentions anglaises et à une noblesse écossaise divisée entre fidélité et ambition.\n\nSaurez-vous, une fois votre majorité venue, préserver l'indépendance chèrement acquise par votre père ?"

 bm_char_edward_iii_desc: "Édouard III d'Angleterre est un roi guerrier au faîte de sa puissance. Héritier des Plantagenêts et petit-fils de Philippe IV par sa mère Isabelle, il revendique la couronne de France face aux Valois. Brillant stratège, il s'appuie sur ses archers gallois et ses alliances flamandes pour porter la guerre sur le continent.\n\nSaurez-vous faire valoir vos droits sur la couronne de France, ou l'Angleterre s'épuisera-t-elle dans un conflit sans fin ?"
 bm_char_philippe_vi_desc: "Philippe VI de Valois est le premier roi de la branche cadette des Capétiens. Sa légitimité, contestée par Édouard III, ne repose que sur la loi salique. Face à l'invasion anglaise, il doit fédérer une noblesse française indisciplinée et trouver les ressources nécessaires pour financer une guerre qui s'annonce longue.\n\nParviendrez-vous à asseoir la légitimité de votre nouvelle dynastie et à repousser les prétentions anglaises sur votre trône ?"
 bm_char_alphonse_xi_desc: "Alphonse XI de Castille est l'un des monarques les plus puissants de la péninsule ibérique. Alors que la Guerre de Cent Ans embrase le nord de l'Europe, il poursuit inlassablement la Reconquista face aux derniers bastions musulmans. Son royaume se trouve au carrefour des alliances franco-anglaises, chacune cherchant à s'attacher sa puissante flotte.\n\nAchèverez-vous la Reconquista, ou la Castille se laissera-t-elle happer par la rivalité entre Paris et Londres ?"
 bm_char_robert_naples_desc: "Robert Ier d'Anjou, dit le Sage, règne sur le royaume de Naples depuis 1309. Protecteur des arts et des lettres, allié naturel de la France, il incarne la puissance angevine en Méditerranée au moment même où la guerre éclate entre Paris et Londres.\n\nFerez-vous de Naples le foyer intellectuel et politique de la Méditerranée chrétienne ?"
 bm_char_gediminas_desc: "Grand-duc de Lituanie, Gediminas règne sur le dernier grand État païen d'Europe, tiraillé entre les assauts incessants de l'Ordre Teutonique et les appels répétés à la conversion. Défendra-t-il les anciens dieux jusqu'au bout, ou verra-t-il dans le baptême une arme diplomatique à double tranchant ?\n\nFerez-vous de la Lituanie païenne un empire capable de rivaliser avec ses voisins chrétiens, ou céderez-vous finalement à la croix ?"
 bm_char_orhan_desc: "Fils d'Osman, Orhan hérite d'un émirat en pleine expansion aux marches de la Bithynie. Sous son règne, les Ottomans prennent pied en Europe pour la première fois, franchissant les Dardanelles. Sa tâche : transformer une principauté frontalière en puissance véritablement européenne.\n\nSerez-vous celui qui installera durablement les Ottomans sur le sol européen ?"

