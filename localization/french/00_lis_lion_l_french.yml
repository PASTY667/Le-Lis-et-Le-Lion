 # ═══════════════════════════════════════════════════════════════════
 # 1307 — La Chute du Temple
 # ═══════════════════════════════════════════════════════════════════
 bm_chute_du_temple_1307: "La Chute du Temple"
 bm_chute_du_temple_1307_desc: "Le vendredi 13 octobre 1307, Philippe IV le Bel fait arrêter simultanément tous les Templiers de France. L'Ordre du Temple, gardien de la foi et des finances de l'Occident, s'effondre sous les accusations. Jacques de Molay brûlera sur le bûcher en 1314 — non sans avoir maudit le roi et le pape. L'Europe entre dans une ère de bouleversements."

 bm_char_philippe_iv: "Philippe IV le Bel"
 bm_char_philippe_iv_desc: "Roi de France depuis 1285, Philippe le Bel est l'homme le plus puissant d'Occident. Son bras de fer avec la papauté, couronné par le transfert du Saint-Siège à Avignon, redessine l'équilibre entre le temporel et le spirituel. En ordonnant l'arrestation des Templiers ce funeste vendredi 13, il atteint l'apogée de son pouvoir — mais peut-être aussi le début d'une malédiction promise par Jacques de Molay depuis son bûcher.\n\nSaurez-vous faire plier la papauté et briser l'Ordre du Temple sans attirer sur votre lignée la vengeance des cieux ?"

 bm_char_edward_ii: "Édouard II"
 bm_char_edward_ii_desc: "Roi d'Angleterre depuis la mort de son père Édouard Ier en juillet 1307, Édouard II hérite d'un royaume en pleine expansion militaire, mais aussi d'un trône écossais toujours contesté par Robert Bruce et d'une noblesse anglaise humiliée par les favoris du roi. Son règne s'annonce semé d'embûches.\n\nParviendrez-vous à dompter vos barons et à achever la conquête de l'Écosse là où votre père a échoué ?"

 bm_char_cangrande: "Cangrande"
 bm_char_cangrande_desc: "Coseigneur de Vérone avec son frère Alboino depuis 1308, Cangrande della Scala est déjà un chef de guerre redouté, à la tête de compagnies de mercenaires aguerries. Son ambition est claire : faire de Vérone la maîtresse de l'Italie du Nord, quitte à écraser Padoue, Trévise et tous ceux qui s'opposeront à sa marche.\n\nBâtirez-vous, à partir d'une simple seigneurie, l'une des grandes puissances de la péninsule italienne ?"

 bm_char_siegfried: "Siegfried"
 bm_char_siegfried_desc: "Grand Maître de l'Ordre Teutonique depuis 1303, Siegfried von Feuchtwangen a transféré le siège de l'Ordre à Marienbourg, en Prusse, au cœur de ses conquêtes baltes. Sa mission : étendre l'État monastique le long du littoral et achever, de gré ou de force, la conversion des derniers peuples baltes encore fidèles à leurs anciens dieux.\n\nFerez-vous de l'Ordre Teutonique la première puissance de la Baltique, au prix du sang des païens et de vos propres chevaliers ?"

 bm_char_andronikos_ii: "Andronikos II"
 bm_char_andronikos_ii_desc: "Empereur byzantin depuis 1282, Andronikos II Paléologue règne sur un empire diminué, rongé par les usurpations de ses proches, l'indiscipline d'une Compagnie catalane devenue incontrôlable et une pression turque grandissante en Anatolie. Sa piété et son érudition suffiront-elles à préserver ce qui reste de la grandeur romaine ?\n\nSaurez-vous redresser Byzance avant que son dernier rempart ne s'effondre ?"

 bm_char_osman: "Osman Ier"
 bm_char_osman_desc: "Chef d'une petite principauté turkmène à la frontière byzantine d'Anatolie, Osman vient de prendre Éphèse et pose, sans le savoir encore, les fondations de ce qui deviendra l'Empire ottoman. Face à un Empire byzantin affaibli et divisé, l'occasion est belle pour un émirat ambitieux.\n\nFerez-vous d'un simple beylik frontalier la graine d'un empire appelé à dominer trois continents ?"

 bm_char_fernando_iv: "Fernando IV"
 bm_char_fernando_iv_desc: "Roi de Castille depuis 1295, Fernando IV, dit « l'Ajourné », a survécu à une minorité tumultueuse dominée par les régences et les révoltes nobiliaires. Sa légende noire — deux frères exécutés à tort l'auraient sommé, du haut de leur bûcher, de le rejoindre devant Dieu dans les trente jours — plane sur un règne marqué par la reprise de la Reconquista face à Grenade.\n\nDéjouerez-vous la malédiction qui pèserait sur vous, ou votre règne s'achèvera-t-il comme la prophétie l'annonce ?"

 # ═══════════════════════════════════════════════════════════════════
 # 1348 — La Mort Noire
 # ═══════════════════════════════════════════════════════════════════
 bm_mort_noire_1348: "La Mort Noire"
 bm_mort_noire_1348_desc: "Venue des steppes d'Asie centrale, la grande peste bubonique atteint l'Europe en 1347. Au printemps 1348, elle dévaste la France et l'Angleterre. Entre un tiers et la moitié de la population européenne mourra. Les guerres s'arrêtent, les routes se vident, les cimetières débordent. Le monde d'avant ne reviendra jamais."

 bm_char_philippe_vi_1348: "Philippe VI"
 bm_char_philippe_vi_1348_desc: "Le roi de France a signé la trêve avec l'Angleterre après les désastres de Crécy (1346) et de Calais (1347). Sa gloire militaire est ternie, son trésor épuisé. Pour beaucoup de ses sujets, la peste qui ravage le royaume n'est rien d'autre qu'une punition divine s'abattant sur un roi vaincu.\n\nRelèverez-vous la France de ses cendres, ou son déclin s'accélérera-t-il sous votre couronne ?"

 bm_char_edward_iii_1348: "Édouard III"
 bm_char_edward_iii_1348_desc: "Vainqueur à Crécy, maître de Calais, Édouard III est au faîte de sa gloire militaire. Mais la peste frappe l'Angleterre aussi durement que la France, sans distinction de rang : sa propre fille Jeanne mourra de la maladie avant même d'atteindre la Castille, où elle devait se marier.\n\nTransformerez-vous vos triomphes militaires en couronne durable, malgré le fléau qui frappe votre royaume comme celui de vos ennemis ?"

 bm_char_stefan_dusan: "Stefan Dušan"
 bm_char_stefan_dusan_desc: "Roi de Serbie, Stefan Dušan mène une conquête fulgurante aux dépens d'un Empire byzantin exsangue. Il rêve d'un empire serbo-grec unifié sous sa couronne, et bientôt d'un titre impérial à la mesure de ses ambitions.\n\nBâtirez-vous, sur les ruines de Byzance, le nouvel empire des Balkans ?"

 bm_char_louis_hongrie: "Louis Ier"
 bm_char_louis_hongrie_desc: "Fils de Charles Ier d'Anjou, roi de Hongrie depuis 1342, Louis Ier hérite d'un royaume déjà puissant et bien administré. Son ambition : en faire l'une des grandes puissances d'Europe centrale, quitte à intervenir jusqu'en Italie du Sud pour venger son frère André, assassiné à Naples.\n\nFerez-vous de la Hongrie l'arbitre de l'Europe centrale, ou votre soif de vengeance napolitaine vous coûtera-t-elle votre couronne ?"

 # ═══════════════════════════════════════════════════════════════════
 # 1356 — Bulla Aurea
 # ═══════════════════════════════════════════════════════════════════
 bm_bulla_aurea_1356: "Bulla Aurea"
 bm_bulla_aurea_1356_desc: "Le 19 septembre 1356, le Prince Noir bat l'armée française à Poitiers et fait prisonnier le roi Jean II. La France sans roi bascule dans la crise : le Dauphin Charles gouverne un pays épuisé, révolté, ravagé. En janvier de la même année, Charles IV a promulgué la Bulle d'Or, charte fondamentale du Saint-Empire romain germanique. Deux textes écrits à l'encre d'or, l'un pour une constitution, l'autre pour une rançon."

 bm_char_charles_iv_1356: "Charles IV"
 bm_char_charles_iv_1356_desc: "Après avoir promulgué la Bulle d'Or en janvier 1356, Charles IV doit désormais gouverner le Saint-Empire et asseoir durablement la domination de la maison de Luxembourg : verrouiller les états électoraux de Bohême et de Brandebourg, et rassembler autant de voix électorales que possible pour faire prospérer sa propre dynastie face aux Habsbourg et aux Wittelsbach.\n\nFerez-vous de la Bulle d'Or le socle d'un Saint-Empire enfin stable, ou les Électeurs se retourneront-ils un jour contre vous ?"

 bm_char_albert_ii: "Albert II"
 bm_char_albert_ii_desc: "Duc d'Autriche depuis 1330, Albert II de Habsbourg, dit « le Sage » malgré son infirmité, a activement soutenu Charles IV de Luxembourg dans sa lutte contre l'empereur Louis IV de Bavière, contribuant à sa chute en 1347. Mais la reconnaissance impériale se fait attendre : la Bulle d'Or de 1356, qui vient de fixer pour des siècles la liste des sept Électeurs, ignore superbement la maison de Habsbourg. Une rancœur amère couve à Vienne.\n\nFerez-vous payer à Charles IV cet affront, ou saurez-vous forger de nouveaux titres pour rattraper les Électeurs ?"

 bm_char_dauphin_charles: "Le dauphin Charles"
 bm_char_dauphin_charles_desc: "Son père Jean II le Bon croupit en captivité chez les Anglais, Paris gronde sous la houlette d'Étienne Marcel, et la Jacquerie couve dans les campagnes. Régner sans en avoir le titre : gouverner une régence aussi contestée est peut-être plus périlleux que de gouverner un royaume en paix.\n\nSaurez-vous tenir votre royaume d'une main ferme jusqu'au retour — ou à la mort — de votre père captif ?"

 bm_char_prince_noir: "Édouard le Prince Noir"
 bm_char_prince_noir_desc: "Vainqueur de Poitiers, le Prince Noir tient le roi de France captif entre ses mains. Son défi : achever la conquête du royaume et transformer ce triomphe éclatant en un véritable empire angevin, aussi durable que celui de ses lointains ancêtres.\n\nFerez-vous de la France une possession anglaise, ou votre victoire restera-t-elle sans lendemain ?"

 bm_char_magnus_iv: "Magnus IV"
 bm_char_magnus_iv_desc: "Roi de Suède et de Norvège, Magnus IV doit tenir tête à la ligue hanséatique, qui contrôle déjà le commerce de la Baltique, et à l'Ordre Teutonique, qui lorgne sur ces mêmes côtes convoitées.\n\nParviendrez-vous à faire de vos royaumes scandinaves unis une puissance maritime capable de rivaliser avec la Hanse ?"

 bm_char_casimir_iii_1356: "Casimir III le Grand"
 bm_char_casimir_iii_1356_desc: "Seul roi de Pologne à mériter le titre de Grand, Casimir le Législateur a réformé les lois du royaume, bâti des dizaines de châteaux et doublé le territoire polonais. Le royaume n'a jamais été aussi fort — reste à savoir s'il survivra à l'absence d'héritier mâle de son roi.\n\nAssurerez-vous la pérennité de votre œuvre, ou la Pologne sombrera-t-elle dans la crise successorale à votre mort ?"

